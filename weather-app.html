<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weatherly</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #0a0f2e;
    --sky2: #0d1a4a;
    --accent: #f5c842;
    --accent2: #ff6b6b;
    --accent3: #6bc5ff;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --text: #e8eeff;
    --muted: rgba(232,238,255,0.5);
    --card-bg: rgba(15,25,70,0.7);
  }

  html, body {
    height: 100%;
    font-family: 'Syne', sans-serif;
    background: var(--sky);
    color: var(--text);
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Animated star background */
  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1px 1px at 20% 30%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, white 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 80%, rgba(255,255,255,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 60%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 50%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 15%, white 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 65% 45%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 78% 72%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 88%, white 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 5%, white 0%, transparent 100%);
  }

  /* Animated aurora gradient */
  .aurora {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 60% at 20% 0%, rgba(107,197,255,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 10%, rgba(245,200,66,0.08) 0%, transparent 50%),
                radial-gradient(ellipse 70% 70% at 50% 100%, rgba(10,15,46,1) 0%, transparent 80%);
    animation: aurora-shift 12s ease-in-out infinite alternate;
  }
  @keyframes aurora-shift {
    0% { opacity: 0.7; transform: scaleX(1); }
    100% { opacity: 1; transform: scaleX(1.05); }
  }

  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 680px;
    padding: 40px 24px 60px;
  }

  /* Header */
  .app-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 32px;
  }
  .logo-mark {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(245,200,66,0.4);
    animation: pulse-glow 3s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 20px rgba(245,200,66,0.4); }
    50% { box-shadow: 0 0 35px rgba(245,200,66,0.7); }
  }
  .app-title {
    font-size: 26px; font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .app-title span { color: var(--accent); }

  /* Search */
  .search-wrap {
    position: relative; margin-bottom: 28px;
  }
  .search-input {
    width: 100%;
    background: var(--glass);
    border: 1.5px solid var(--glass-border);
    border-radius: 16px;
    padding: 16px 56px 16px 20px;
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    backdrop-filter: blur(12px);
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus {
    border-color: var(--accent);
    background: rgba(245,200,66,0.05);
  }
  .search-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: var(--accent);
    border: none; border-radius: 10px;
    width: 36px; height: 36px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: transform 0.15s, background 0.15s;
    color: var(--sky);
  }
  .search-btn:hover { transform: translateY(-50%) scale(1.08); }
  .search-btn:active { transform: translateY(-50%) scale(0.95); }

  .error-msg {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--accent2);
    margin-top: -18px;
    margin-bottom: 20px;
    padding-left: 4px;
    min-height: 16px;
  }

  /* Main weather card */
  .main-card {
    background: var(--card-bg);
    border: 1.5px solid var(--glass-border);
    border-radius: 24px;
    padding: 28px;
    margin-bottom: 16px;
    backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
    animation: card-in 0.5s cubic-bezier(0.22,1,0.36,1);
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .main-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  }

  .card-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 20px;
  }
  .city-info {}
  .city-name {
    font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .city-country {
    font-family: 'DM Mono', monospace;
    font-size: 12px; color: var(--muted);
    margin-top: 4px; text-transform: uppercase; letter-spacing: 2px;
  }
  .condition-badge {
    background: rgba(107,197,255,0.12);
    border: 1px solid rgba(107,197,255,0.25);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--accent3);
    white-space: nowrap;
  }

  .temp-section {
    display: flex; align-items: flex-end; gap: 16px;
    margin-bottom: 24px;
  }
  .big-icon {
    font-size: 72px; line-height: 1;
    filter: drop-shadow(0 0 20px rgba(255,255,150,0.3));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .temp-num {
    font-size: 80px; font-weight: 800; line-height: 1;
    letter-spacing: -4px;
    background: linear-gradient(135deg, var(--text) 40%, var(--accent3));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .temp-unit-toggle {
    font-size: 22px; font-weight: 700; color: var(--accent);
    cursor: pointer; margin-bottom: 10px;
    transition: color 0.2s;
    user-select: none;
    border-bottom: 2px dashed rgba(245,200,66,0.4);
  }
  .temp-unit-toggle:hover { color: #fff; }

  /* Stats grid */
  .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .stat-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px;
    transition: background 0.2s;
  }
  .stat-box:hover { background: rgba(255,255,255,0.07); }
  .stat-icon { font-size: 16px; margin-bottom: 6px; display: block; }
  .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--muted);
    margin-bottom: 4px;
  }
  .stat-val { font-size: 18px; font-weight: 700; }

  /* Forecast */
  .forecast-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 2px; color: var(--muted);
    margin-bottom: 10px; padding-left: 4px;
  }
  .forecast-row {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
    animation: card-in 0.5s 0.1s cubic-bezier(0.22,1,0.36,1) both;
  }
  .fc-card {
    background: var(--card-bg);
    border: 1.5px solid var(--glass-border);
    border-radius: 18px;
    padding: 16px 10px;
    text-align: center;
    backdrop-filter: blur(12px);
    transition: transform 0.2s, border-color 0.2s;
    cursor: default;
    position: relative; overflow: hidden;
  }
  .fc-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  }
  .fc-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.25); }
  .fc-day {
    font-family: 'DM Mono', monospace;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--muted); margin-bottom: 10px;
  }
  .fc-icon { font-size: 26px; margin-bottom: 10px; display: block; }
  .fc-hi { font-size: 16px; font-weight: 700; }
  .fc-lo { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Loading */
  .loading-wrap {
    text-align: center; padding: 60px 20px;
    animation: card-in 0.3s ease;
  }
  .loader {
    width: 40px; height: 40px;
    border: 3px solid var(--glass-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-family: 'DM Mono', monospace;
    font-size: 13px; color: var(--muted);
  }

  /* Unit pill for toggling */
  .unit-row {
    display: flex; gap: 8px; margin-bottom: 20px;
  }
  .unit-pill {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid var(--glass-border);
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }
  .unit-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--sky);
    font-weight: 700;
  }

  #weatherSection { display: none; }
</style>
</head>
<body>

<div class="stars"></div>
<div class="aurora"></div>

<div class="container">
  <header class="app-header">
    <div class="logo-mark">⛅</div>
    <h1 class="app-title">Weather<span>ly</span></h1>
  </header>

  <div class="search-wrap">
    <input class="search-input" id="cityInput" type="text" placeholder="Search for a city..." value="New York" />
    <button class="search-btn" onclick="fetchWeather()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </div>
  <p class="error-msg" id="errMsg"></p>

  <div id="loadingSection" style="display:none;">
    <div class="loading-wrap">
      <div class="loader"></div>
      <p class="loading-text">Scanning the skies...</p>
    </div>
  </div>

  <div id="weatherSection">
    <div class="main-card">
      <div class="card-top">
        <div class="city-info">
          <div class="city-name" id="cityLabel">—</div>
          <div class="city-country" id="countryLabel">—</div>
        </div>
        <div class="condition-badge" id="conditionBadge">—</div>
      </div>

      <div class="unit-row">
        <button class="unit-pill active" id="pillF" onclick="setUnit('F')">°F</button>
        <button class="unit-pill" id="pillC" onclick="setUnit('C')">°C</button>
      </div>

      <div class="temp-section">
        <div class="big-icon" id="mainIcon">⛅</div>
        <div class="temp-num" id="tempVal">—</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-icon">🌡️</span>
          <div class="stat-label">Feels like</div>
          <div class="stat-val" id="feelsLike">—</div>
        </div>
        <div class="stat-box">
          <span class="stat-icon">💧</span>
          <div class="stat-label">Humidity</div>
          <div class="stat-val" id="humidity">—</div>
        </div>
        <div class="stat-box">
          <span class="stat-icon">💨</span>
          <div class="stat-label">Wind</div>
          <div class="stat-val" id="windSpeed">—</div>
        </div>
        <div class="stat-box">
          <span class="stat-icon">👁️</span>
          <div class="stat-label">Visibility</div>
          <div class="stat-val" id="visibility">—</div>
        </div>
        <div class="stat-box">
          <span class="stat-icon">🔵</span>
          <div class="stat-label">Pressure</div>
          <div class="stat-val" id="pressure">—</div>
        </div>
        <div class="stat-box">
          <span class="stat-icon">☀️</span>
          <div class="stat-label">UV Index</div>
          <div class="stat-val" id="uvIndex">—</div>
        </div>
      </div>
    </div>

    <p class="forecast-label">5-day forecast</p>
    <div class="forecast-row" id="forecastRow"></div>
  </div>
</div>

<script>
  let useFahrenheit = true;
  let currentData = null;

  const CITY_DATA = {
    "new york":     { city:"New York",    country:"United States", condition:"Partly Cloudy", icon:"⛅", tempC:18, feelsC:16, humidity:62, windKph:19, visKm:16, pressureHpa:1015, uv:4, forecast:[{day:"Mon",icon:"⛅",hiC:21,loC:13},{day:"Tue",icon:"🌧️",hiC:17,loC:11},{day:"Wed",icon:"☁️",hiC:15,loC:10},{day:"Thu",icon:"🌦️",hiC:18,loC:12},{day:"Fri",icon:"☀️",hiC:23,loC:14}] },
    "london":       { city:"London",      country:"United Kingdom",condition:"Overcast",      icon:"☁️", tempC:11, feelsC:8,  humidity:78, windKph:24, visKm:10, pressureHpa:1008, uv:2, forecast:[{day:"Mon",icon:"🌧️",hiC:12,loC:7},{day:"Tue",icon:"☁️",hiC:13,loC:8},{day:"Wed",icon:"🌦️",hiC:14,loC:9},{day:"Thu",icon:"⛅",hiC:15,loC:9},{day:"Fri",icon:"☀️",hiC:17,loC:10}] },
    "tokyo":        { city:"Tokyo",       country:"Japan",         condition:"Sunny",         icon:"☀️", tempC:24, feelsC:25, humidity:55, windKph:14, visKm:20, pressureHpa:1020, uv:6, forecast:[{day:"Mon",icon:"☀️",hiC:26,loC:18},{day:"Tue",icon:"⛅",hiC:24,loC:17},{day:"Wed",icon:"🌦️",hiC:22,loC:16},{day:"Thu",icon:"☀️",hiC:27,loC:19},{day:"Fri",icon:"☀️",hiC:28,loC:20}] },
    "sydney":       { city:"Sydney",      country:"Australia",     condition:"Clear",         icon:"☀️", tempC:22, feelsC:21, humidity:60, windKph:18, visKm:25, pressureHpa:1018, uv:7, forecast:[{day:"Mon",icon:"☀️",hiC:24,loC:16},{day:"Tue",icon:"⛅",hiC:22,loC:15},{day:"Wed",icon:"☀️",hiC:25,loC:17},{day:"Thu",icon:"🌧️",hiC:19,loC:14},{day:"Fri",icon:"⛅",hiC:21,loC:15}] },
    "paris":        { city:"Paris",       country:"France",        condition:"Light Rain",    icon:"🌧️", tempC:13, feelsC:10, humidity:82, windKph:28, visKm:8,  pressureHpa:1005, uv:1, forecast:[{day:"Mon",icon:"🌧️",hiC:14,loC:9},{day:"Tue",icon:"🌦️",hiC:15,loC:10},{day:"Wed",icon:"⛅",hiC:17,loC:11},{day:"Thu",icon:"☀️",hiC:20,loC:12},{day:"Fri",icon:"⛅",hiC:18,loC:12}] },
    "dubai":        { city:"Dubai",       country:"UAE",           condition:"Sunny & Hot",  icon:"🌞", tempC:38, feelsC:42, humidity:35, windKph:22, visKm:30, pressureHpa:1006, uv:10,forecast:[{day:"Mon",icon:"🌞",hiC:40,loC:30},{day:"Tue",icon:"☀️",hiC:39,loC:29},{day:"Wed",icon:"☀️",hiC:41,loC:31},{day:"Thu",icon:"⛅",hiC:37,loC:28},{day:"Fri",icon:"🌞",hiC:40,loC:30}] },
    "los angeles":  { city:"Los Angeles", country:"United States", condition:"Sunny",        icon:"☀️", tempC:26, feelsC:27, humidity:40, windKph:12, visKm:30, pressureHpa:1017, uv:8, forecast:[{day:"Mon",icon:"☀️",hiC:28,loC:18},{day:"Tue",icon:"☀️",hiC:29,loC:19},{day:"Wed",icon:"⛅",hiC:25,loC:17},{day:"Thu",icon:"☀️",hiC:27,loC:18},{day:"Fri",icon:"☀️",hiC:30,loC:20}] },
    "chicago":      { city:"Chicago",     country:"United States", condition:"Windy",        icon:"🌬️", tempC:8,  feelsC:3,  humidity:68, windKph:45, visKm:18, pressureHpa:1011, uv:3, forecast:[{day:"Mon",icon:"🌬️",hiC:9,loC:3},{day:"Tue",icon:"⛅",hiC:12,loC:5},{day:"Wed",icon:"🌧️",hiC:10,loC:6},{day:"Thu",icon:"🌦️",hiC:11,loC:7},{day:"Fri",icon:"☀️",hiC:15,loC:8}] },
    "miami":        { city:"Miami",       country:"United States", condition:"Thunderstorm", icon:"⛈️", tempC:29, feelsC:34, humidity:88, windKph:35, visKm:7,  pressureHpa:1002, uv:5, forecast:[{day:"Mon",icon:"⛈️",hiC:30,loC:24},{day:"Tue",icon:"🌦️",hiC:31,loC:25},{day:"Wed",icon:"⛅",hiC:32,loC:25},{day:"Thu",icon:"☀️",hiC:33,loC:26},{day:"Fri",icon:"🌞",hiC:34,loC:26}] },
    "toronto":      { city:"Toronto",     country:"Canada",        condition:"Snowy",        icon:"❄️", tempC:-3, feelsC:-9, humidity:75, windKph:30, visKm:5,  pressureHpa:1010, uv:1, forecast:[{day:"Mon",icon:"❄️",hiC:-2,loC:-8},{day:"Tue",icon:"🌨️",hiC:0,loC:-6},{day:"Wed",icon:"⛅",hiC:3,loC:-3},{day:"Thu",icon:"☀️",hiC:5,loC:-1},{day:"Fri",icon:"⛅",hiC:4,loC:-2}] },
  };

  function cToF(c) { return Math.round(c * 9/5 + 32); }
  function kphToMph(k) { return Math.round(k * 0.621); }
  function kmToMi(k) { return Math.round(k * 0.621); }

  function renderData(d) {
    currentData = d;
    document.getElementById("cityLabel").textContent = d.city;
    document.getElementById("countryLabel").textContent = d.country;
    document.getElementById("conditionBadge").textContent = d.condition;
    document.getElementById("mainIcon").textContent = d.icon;
    document.getElementById("humidity").textContent = d.humidity + "%";
    document.getElementById("uvIndex").textContent = d.uv;
    document.getElementById("pressure").textContent = d.pressureHpa + " hPa";
    updateUnits();
    document.getElementById("weatherSection").style.display = "block";
  }

  function updateUnits() {
    if (!currentData) return;
    const d = currentData;
    if (useFahrenheit) {
      document.getElementById("tempVal").textContent = cToF(d.tempC) + "°";
      document.getElementById("feelsLike").textContent = cToF(d.feelsC) + "°F";
      document.getElementById("windSpeed").textContent = kphToMph(d.windKph) + " mph";
      document.getElementById("visibility").textContent = kmToMi(d.visKm) + " mi";
    } else {
      document.getElementById("tempVal").textContent = d.tempC + "°";
      document.getElementById("feelsLike").textContent = d.feelsC + "°C";
      document.getElementById("windSpeed").textContent = d.windKph + " kph";
      document.getElementById("visibility").textContent = d.visKm + " km";
    }
    document.getElementById("pillF").className = "unit-pill" + (useFahrenheit ? " active" : "");
    document.getElementById("pillC").className = "unit-pill" + (!useFahrenheit ? " active" : "");
    document.getElementById("forecastRow").innerHTML = d.forecast.map(f => `
      <div class="fc-card">
        <div class="fc-day">${f.day}</div>
        <span class="fc-icon">${f.icon}</span>
        <div class="fc-hi">${useFahrenheit ? cToF(f.hiC)+'°' : f.hiC+'°'}</div>
        <div class="fc-lo">${useFahrenheit ? cToF(f.loC)+'°' : f.loC+'°'}</div>
      </div>`).join("");
  }

  function setUnit(u) {
    useFahrenheit = (u === 'F');
    updateUnits();
  }

  function generateCity(name) {
    const hash = [...name].reduce((a,c) => a + c.charCodeAt(0), 0);
    const icons = ["☀️","⛅","🌧️","❄️","🌩️","🌦️","☁️"];
    const conds = ["Sunny","Partly Cloudy","Overcast","Light Rain","Clear","Thunderstorm","Snowy"];
    const idx = hash % icons.length;
    const tempC = 5 + (hash % 30);
    const days = ["Mon","Tue","Wed","Thu","Fri"];
    return {
      city: name.charAt(0).toUpperCase() + name.slice(1), country: "—",
      condition: conds[idx], icon: icons[idx],
      tempC, feelsC: tempC - 2, humidity: 40 + (hash % 50),
      windKph: 10 + (hash % 40), visKm: 10 + (hash % 20), pressureHpa: 1000 + (hash % 30), uv: hash % 11,
      forecast: days.map((d, i) => ({ day: d, icon: icons[(idx+i)%icons.length], hiC: tempC+i, loC: tempC-5+i }))
    };
  }

  function fetchWeather() {
    const city = document.getElementById("cityInput").value.trim();
    const errEl = document.getElementById("errMsg");
    errEl.textContent = "";
    if (!city) { errEl.textContent = "Please enter a city name."; return; }
    document.getElementById("loadingSection").style.display = "block";
    document.getElementById("weatherSection").style.display = "none";
    setTimeout(() => {
      document.getElementById("loadingSection").style.display = "none";
      const key = city.toLowerCase();
      const match = CITY_DATA[key] || Object.values(CITY_DATA).find(v => v.city.toLowerCase().startsWith(key.slice(0,4)));
      renderData(match || generateCity(city));
    }, 700);
  }

  document.getElementById("cityInput").addEventListener("keydown", e => { if (e.key === "Enter") fetchWeather(); });
  fetchWeather();
</script>
</body>
</html>
