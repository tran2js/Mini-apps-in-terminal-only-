<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JS Sudoku</title>
    <style>
        :root { --border-size: 2px; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f2f5; }
        
        .controls { margin: 20px; display: flex; gap: 10px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { background: #0056b3; }

        /* The 9x9 Grid */
        #grid { 
            display: grid; 
            grid-template-columns: repeat(9, 45px); 
            grid-template-rows: repeat(9, 45px); 
            gap: 0; 
            border: var(--border-size) solid #333; 
            background-color: #333;
        }

        /* Individual Cells */
        .cell {
            width: 45px;
            height: 45px;
            background: white;
            border: 0.5px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-sizing: border-box;
            cursor: pointer;
        }

        /* Thicker borders for the 3x3 subgrids */
        .cell:nth-child(3n) { border-right: var(--border-size) solid #333; }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: var(--border-size) solid #333; }

        /* Logic Styles */
        .cell.original { background: #e9ecef; font-weight: bold; cursor: default; }
        .cell.user-input { color: #007bff; }
        .cell:focus { outline: 2px solid #007bff; background: #e7f3ff; }
        
        #message { margin-top: 20px; font-weight: bold; min-height: 1.2em; }
    </style>
</head>
<body>

    <h1>Sudoku</h1>

    <div class="controls">
        <button onclick="startNewGame('easy')">Easy</button>
        <button onclick="startNewGame('medium')">Medium</button>
        <button onclick="startNewGame('hard')">Hard</button>
        <button onclick="checkWin()" style="background:#28a745">Check Result</button>
    </div>

    <div id="grid"></div>
    <div id="message"></div>

    <script src="sudoku.js"></script>
    <script>
        let game;
        const gridElement = document.getElementById('grid');
        const messageElement = document.getElementById('message');

        function startNewGame(difficulty) {
            messageElement.innerText = "";
            game = new SudokuGame(difficulty);
            renderGrid();
        }

        function renderGrid() {
            gridElement.innerHTML = "";
            game.currentGrid.forEach((row, rIdx) => {
                row.forEach((val, cIdx) => {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    // If it's a number from the generator, lock it
                    if (game.originalPuzzle[rIdx][cIdx] !== 0) {
                        cell.innerText = val;
                        cell.classList.add('original');
                    } else {
                        // If it's empty, make it playable
                        cell.contentEditable = true;
                        cell.classList.add('user-input');
                        if (val !== 0) cell.innerText = val;

                        // Listen for typing
                        cell.oninput = (e) => handleInput(e, rIdx, cIdx);
                    }
                    gridElement.appendChild(cell);
                });
            });
        }

        function handleInput(e, r, c) {
            const val = parseInt(e.target.innerText);
            if (isNaN(val) || val < 1 || val > 9) {
                e.target.innerText = "";
                game.currentGrid[r][c] = 0;
            } else {
                e.target.innerText = val.toString().charAt(0); // Keep only 1 digit
                game.currentGrid[r][c] = parseInt(e.target.innerText);
            }
        }

        function checkWin() {
            if (game.isComplete()) {
                messageElement.style.color = "green";
                messageElement.innerText = "🎉 You won! Perfect Sudoku!";
            } else {
                messageElement.style.color = "red";
                messageElement.innerText = "❌ Not quite finished or there is a mistake.";
            }
        }

        // Auto-start game on load
        startNewGame('medium');
    </script>
</body>
</html>
